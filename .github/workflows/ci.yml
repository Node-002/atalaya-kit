name: CI

on:
  push:
    branches: [hackathon/mvp, main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lista los commits de la PR

jobs:
  pruebas:
    name: Pruebas, estilo y seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15  # un trabajo colgado no gasta minutos sin limite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Estilo (ruff)
        run: ruff check .

      - name: Pruebas con cobertura (pytest)
        run: pytest -q --cov=app --cov-report=term

      - name: Analisis estatico de seguridad (bandit)
        run: bandit -q -r app -x app/tests

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
